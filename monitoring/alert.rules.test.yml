# Unit tests for the alert rules in rules/alert.rules.yml, run by
# Prometheus' own promtool against the real rule file (issue #333):
#
#   docker run --rm -v "$PWD/monitoring:/monitoring" -w /monitoring \
#     prom/prometheus:latest promtool test rules alert.rules.test.yml
#
# The first two cases below are the same failure seen from the two histories
# Prometheus can have: one where it watched the metric before anything
# failed, and one where its very first sample of the series already
# carries the failure — a job that fails between songmaker-web becoming
# healthy and the first scrape of it. The second case is what a counter
# and increase() cannot see, and it is why this metric is a timestamp.
#
# promtool's clock starts at Unix time 0, so the timestamps below are
# minutes from epoch and every eval_time is past the 15-minute window to
# keep "never failed" (a metric reading 0) from looking recent.
rule_files:
  - rules/alert.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: a failure Prometheus watched the metric across
    input_series:
      - series: songmaker_last_job_failure_timestamp_seconds
        # Reads 0 ("nothing has ever failed") for half an hour, then
        # carries a failure that finished at minute 30.
        values: "0x29 1800x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: SongmakerJobFailure
        exp_alerts: []
      - eval_time: 31m
        alertname: SongmakerJobFailure
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Songmaker jobs are failing
              description: At least one job failed within the last 15 minutes.
      - eval_time: 50m
        alertname: SongmakerJobFailure
        exp_alerts: []

  - interval: 1m
    name: a failure that is already there on the first sample
    input_series:
      - series: songmaker_last_job_failure_timestamp_seconds
        # No sample at all until minute 30 — Prometheus starts scraping a
        # stack whose first job has already failed.
        values: "_x29 1800x30"
    alert_rule_test:
      - eval_time: 31m
        alertname: SongmakerJobFailure
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Songmaker jobs are failing
              description: At least one job failed within the last 15 minutes.

  - interval: 1m
    name: a failure older than the window stays quiet
    input_series:
      - series: songmaker_last_job_failure_timestamp_seconds
        values: "60x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: SongmakerJobFailure
        exp_alerts: []

  - interval: 1m
    name: a dead background loop alerts after its hold period
    input_series:
      - series: 'songmaker_background_loop_alive{loop="score_backfill"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: SongmakerBackgroundLoopUnhealthy
        exp_alerts: []
      - eval_time: 5m
        alertname: SongmakerBackgroundLoopUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              loop: score_backfill
            exp_annotations:
              summary: A Songmaker background loop is unhealthy
              description: A background loop has stopped or failed three consecutive ticks.

  - interval: 1m
    name: a failing background loop alerts after its hold period
    input_series:
      - series: 'songmaker_background_loop_consecutive_failures{loop="session_sync"}'
        values: "3x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: SongmakerBackgroundLoopUnhealthy
        exp_alerts: []
      - eval_time: 5m
        alertname: SongmakerBackgroundLoopUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              loop: session_sync
            exp_annotations:
              summary: A Songmaker background loop is unhealthy
              description: A background loop has stopped or failed three consecutive ticks.

  - interval: 1m
    name: a healthy background loop stays quiet
    input_series:
      - series: 'songmaker_background_loop_alive{loop="stale_job_reaper"}'
        values: "1x10"
      - series: 'songmaker_background_loop_consecutive_failures{loop="stale_job_reaper"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 9m
        alertname: SongmakerBackgroundLoopUnhealthy
        exp_alerts: []

  - interval: 1m
    name: a dead and failing loop produces one alert
    input_series:
      - series: 'songmaker_background_loop_alive{loop="resource_event_cleanup"}'
        values: "0x10"
      - series: 'songmaker_background_loop_consecutive_failures{loop="resource_event_cleanup"}'
        values: "3x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: SongmakerBackgroundLoopUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              loop: resource_event_cleanup
            exp_annotations:
              summary: A Songmaker background loop is unhealthy
              description: A background loop has stopped or failed three consecutive ticks.
