<!doctype html>
<html><head><meta charset="utf-8"><title>Mobile390</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Open+Sans:wght@400;600&display=swap');
body{margin:0;background:#f4f4f6;color:#1a1a1e;font-family:'Open Sans',Arial,sans-serif;font-size:15px}
a{color:#7a18c0}a:hover{color:#5c1090}
.disp{font-family:'Oswald',Impact,sans-serif;text-transform:uppercase;letter-spacing:1px}
.logo{font-family:'Oswald',Impact,sans-serif;text-transform:uppercase;letter-spacing:4px;font-weight:700;color:#a020f0;font-size:16px}
.muted{color:#555}.dim{color:#999}
.pill{border:1px solid #d0d0d4;border-radius:16px;padding:3px 10px;font-size:12px;background:#fff}
.pill.on{background:#7a18c0;color:#fff;border-color:#7a18c0}
.tile{background:#fff;border:1px solid #d0d0d4;border-radius:6px;overflow:hidden}
.cover{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:'Oswald',Impact,sans-serif;font-size:28px;color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #e8e8ec;background:#fff}
.ic{width:20px;height:20px;stroke:#555;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.accent{stroke:#7a18c0}.ic.red{stroke:#d41a0a;fill:#d41a0a}
.btn{border:1px solid #d0d0d4;border-radius:16px;padding:7px 16px;font-size:13px;background:#fff;letter-spacing:.5px}
.btn.gen{background:#7a18c0;color:#fff;border-color:#7a18c0;font-family:'Oswald',Impact,sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:14px}
.player{position:absolute;left:0;right:0;bottom:0;height:88px;background:#fff;border-top:1px solid #d0d0d4;display:flex;align-items:center;gap:16px;padding:0 20px}
.play{width:48px;height:48px;border-radius:50%;border:2px solid #d41a0a;display:flex;align-items:center;justify-content:center}
.note{background:#fff7d6;border:1px solid #e6d48a;border-radius:4px;padding:8px 10px;font-size:12px;color:#5a4a00}
</style></head><body>
<div style="position:relative;width:390px;height:844px;background:#f4f4f6;overflow:hidden">
  <div style="height:46px;background:#fff;border-bottom:1px solid #d0d0d4;display:flex;align-items:center;gap:12px;padding:0 14px"><svg class="ic" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg><span class="logo" style="font-size:14px">Hallucinai</span><span style="margin-left:auto"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.5" y2="16.5"></line></svg></span></div>
  <div style="position:absolute;top:46px;bottom:144px;left:0;right:0;padding:14px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:10px"><div class="cover" style="width:52px;background:#7a18c0;font-size:16px">SO</div><div style="display:flex;flex-direction:column;gap:2px"><span class="disp" style="font-size:22px;font-weight:700">Sommerlicht</span><span class="dim" style="font-size:12px">3 songs · 2 picks</span></div><span style="margin-left:auto"><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></span></div>
    <div class="row" style="border:1px solid #d0d0d4;border-radius:6px;min-height:48px"><svg class="ic" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg><span>Sommerlicht</span><span class="pill on" style="margin-left:auto">Pick</span></div>
    <div class="row" style="border:1px solid #d0d0d4;border-radius:6px;min-height:48px"><svg class="ic" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg><span>Two Tab Proof</span><span class="dim" style="margin-left:auto;font-size:11px">1 take</span></div>
    <div class="row" style="border:1px solid #d0d0d4;border-radius:6px;min-height:48px"><svg class="ic" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg><span>Nachtfahrt</span><span class="dim" style="margin-left:auto;font-size:11px">—</span></div>
    <span class="dim" style="font-size:12px;padding:4px 2px">Tap a title to edit · Play plays the pick · Menu opens Library and Settings</span>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:144px;background:#fff;border-top:1px solid #d0d0d4;display:flex;flex-direction:column;gap:10px;padding:12px 16px">
    <div style="display:flex;align-items:center;gap:10px"><div style="display:flex;flex-direction:column;gap:2px;flex-grow:1"><span class="disp" style="font-size:14px">Sommerlicht</span><span class="dim" style="font-size:12px">Sommerlicht · take 3</span></div><span class="dim" style="font-size:12px">1:12 / 3:15</span></div>
    <div style="height:2px;background:#d0d0d4"><div style="width:38%;height:2px;background:#d41a0a"></div></div>
    <div style="display:flex;align-items:center;justify-content:space-between"><span class="dim" style="display:flex;align-items:center;gap:4px;font-size:12px">Now Playing <svg class="ic" viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"></polyline></svg></span><div style="display:flex;align-items:center;gap:14px"><svg class="ic" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg><div class="play"><svg class="ic red" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg></div><svg class="ic" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg></div></div>
  </div>
</div>
</body></html>
