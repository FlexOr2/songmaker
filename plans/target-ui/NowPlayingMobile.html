<!doctype html>
<html><head><meta charset="utf-8"><title>NowPlayingMobile</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Open+Sans:wght@400;600&display=swap');
body{margin:0;background:#f4f4f6;color:#1a1a1e;font-family:'Open Sans',Arial,sans-serif;font-size:15px}
a{color:#7a18c0}a:hover{color:#5c1090}
.disp{font-family:'Oswald',Impact,sans-serif;text-transform:uppercase;letter-spacing:1px}
.logo{font-family:'Oswald',Impact,sans-serif;text-transform:uppercase;letter-spacing:4px;font-weight:700;color:#a020f0;font-size:16px}
.muted{color:#555}.dim{color:#999}
.pill{border:1px solid #d0d0d4;border-radius:16px;padding:3px 10px;font-size:12px;background:#fff}
.pill.on{background:#7a18c0;color:#fff;border-color:#7a18c0}
.tile{background:#fff;border:1px solid #d0d0d4;border-radius:6px;overflow:hidden}
.cover{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:'Oswald',Impact,sans-serif;font-size:28px;color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #e8e8ec;background:#fff}
.ic{width:20px;height:20px;stroke:#555;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.accent{stroke:#7a18c0}.ic.red{stroke:#d41a0a;fill:#d41a0a}
.btn{border:1px solid #d0d0d4;border-radius:16px;padding:7px 16px;font-size:13px;background:#fff;letter-spacing:.5px}
.btn.gen{background:#7a18c0;color:#fff;border-color:#7a18c0;font-family:'Oswald',Impact,sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:14px}
.player{position:absolute;left:0;right:0;bottom:0;height:88px;background:#fff;border-top:1px solid #d0d0d4;display:flex;align-items:center;gap:16px;padding:0 20px}
.play{width:48px;height:48px;border-radius:50%;border:2px solid #d41a0a;display:flex;align-items:center;justify-content:center}
.note{background:#fff7d6;border:1px solid #e6d48a;border-radius:4px;padding:8px 10px;font-size:12px;color:#5a4a00}
</style></head><body>
<div style="position:relative;width:390px;height:844px;background:#0d0d0d;color:#e0e0e0;overflow:hidden;display:flex;flex-direction:column;gap:18px;padding:16px 22px 28px">
  <div style="display:flex;align-items:center;gap:8px;color:#888;font-size:13px"><svg class="ic" style="stroke:#e0e0e0" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg><span>Sommerlicht</span><span style="margin-left:auto;font-size:12px">Picks</span></div>
  <div class="cover" style="width:346px;background:#7a18c0;font-size:64px;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6)">SO</div>
  <div style="display:flex;flex-direction:column;gap:2px"><span class="disp" style="font-size:24px;font-weight:700;color:#fff">Sommerlicht</span><span style="color:#888;font-size:13px">track 1 of 3</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="color:#888;font-size:12px">1:12</span><div style="flex-grow:1;height:3px;background:#333;border-radius:2px"><div style="width:38%;height:3px;background:#ff3220;border-radius:2px"></div></div><span style="color:#888;font-size:12px">3:15</span></div>
  <div style="display:flex;align-items:center;justify-content:space-between"><svg class="ic" style="stroke:#e0e0e0" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg><svg class="ic" style="stroke:#e0e0e0" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg><div class="play" style="width:64px;height:64px;border-color:#ff3220"><svg class="ic red" style="stroke:#ff3220;fill:#ff3220" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg></div><svg class="ic" style="stroke:#e0e0e0" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg><span style="width:20px"></span></div>
  <div style="font-family:monospace;font-size:15px;line-height:1.7;color:#666;flex-grow:1;overflow:hidden">Fenster auf, die Luft schmeckt weit.<br><span style="color:#fff;font-weight:600">Alles, was uns gestern schwer war,</span><br>traegt das Licht heut wie Konfetti fort.<br><br>Und wenn der Himmel golden ueberlaeuft,<br>halt die Haende auf —</div>
  <div style="display:flex;align-items:center;gap:8px;color:#888;font-size:12px;border-top:1px solid #222;padding-top:12px"><span>Up next: Two Tab Proof</span><span style="margin-left:auto;display:flex;align-items:center;gap:4px">Queue <svg class="ic" style="stroke:#e0e0e0" viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"></polyline></svg></span></div>
</div>
</body></html>
