title: "Friday at Murphy's"
artist: "Flex0r"
year: 2026
description: >
  A concept album set entirely at Murphy's Irish Pub in Erlangen.
  Different stories, different styles, same bar. From the Friday night
  chaos to the 2am last call, from punk rock anthems to feminist rap —
  every track is a snapshot of the people and moments that make
  Murphy's feel like home.
