services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-songmaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-songmaker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-songmaker}"]
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-songmaker}
    entrypoint: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"
    cap_drop:
      - ALL

  songmaker-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GENERATION_RATE_LIMIT_USER: ${GENERATION_RATE_LIMIT_USER:-20}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SONGMAKER_INTERNAL_TOKEN: "${SONGMAKER_INTERNAL_TOKEN:-}"
      HOST: "0.0.0.0"
    # Published to the loopback interface only: Docker's NAT chain bypasses
    # the INPUT chain (and with it UFW), so a "8080:8080" binding reaches the
    # whole LAN regardless of the host firewall. Everything that needs this
    # port is host-local (the cloudflared tunnel, the Vite dev proxy, the
    # CLI); in-cluster callers use songmaker-web:8080 on the compose network,
    # which is unaffected.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - audiofiles:/app/data/audio
      - queuestreams:/app/data/queue-streams
      # Agent-CLI mounts: the container owns the writable profiles; it only
      # receives read-only CLI binaries and redacted login mirrors. The
      # preflight checks the mirror and the default or environment-selected
      # CLI paths before deploy.
      - type: bind
        source: ${SONGMAKER_CLAUDE_CLI:-~/.local/bin/claude}
        target: /usr/local/bin/claude
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SONGMAKER_GROK_CLI:-~/.grok/bin/grok}
        target: /usr/local/bin/grok
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SONGMAKER_CODEX_CLI:-~/.local/node/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex}
        target: /usr/local/bin/codex
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SONGMAKER_CLI_CREDENTIALS_DIR:-~/.songmaker/agent-cli-credentials}/claude.json
        target: /home/songmaker/.claude/.credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SONGMAKER_CLI_CREDENTIALS_DIR:-~/.songmaker/agent-cli-credentials}/grok.json
        target: /home/songmaker/.grok/auth.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SONGMAKER_CLI_CREDENTIALS_DIR:-~/.songmaker/agent-cli-credentials}/codex.json
        target: /home/songmaker/.codex/auth.json
        read_only: true
        bind:
          create_host_path: false
    cap_drop:
      - ALL

  songmaker-music-worker:
    build:
      context: .
      dockerfile: docker/music-worker.Dockerfile
    command: ["songmaker_cli.music_worker.MusicWorkerSettings"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "scripts/arq_healthcheck.py", "music"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      MUSIC_MAX_JOBS: "${MUSIC_MAX_JOBS:-2}"
      ARQ_JOB_TIMEOUT: "${ARQ_JOB_TIMEOUT:-300}"
      SONGMAKER_INTERNAL_TOKEN: "${SONGMAKER_INTERNAL_TOKEN:-}"
    volumes:
      - audiofiles:/app/data/audio

  songmaker-acestep-worker-0:
    build:
      context: .
      dockerfile: docker/acestep-worker.Dockerfile
    runtime: nvidia
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      WORKER_ID: "acestep-worker-0"
      WORKER_HOST: "songmaker-acestep-worker-0"
      WORKER_PORT: "8001"
      GPU_ID: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
      VRAM_BUDGET_GB: "${ACESTEP_WORKER_VRAM_GB:-24}"
      ACESTEP_STARTUP_TIMEOUT_SECONDS: "${ACESTEP_STARTUP_TIMEOUT_SECONDS:-300}"
      ACESTEP_LM_MODEL_PATH: "${ACESTEP_LM_MODEL_PATH:-acestep-5Hz-lm-4B}"
      # Empty means "use ACE-Step's own default": the GPU tier's
      # max_duration_with_lm, and a single sample per request.
      ACESTEP_LM_DIT_RESERVE_DURATION_S: "${ACESTEP_LM_DIT_RESERVE_DURATION_S:-}"
      ACESTEP_LM_DIT_RESERVE_BATCH: "${ACESTEP_LM_DIT_RESERVE_BATCH:-}"
      # The preflight is active again (#202): the fork's LM allocator now
      # keeps the DiT's duration-aware demand free, so long xl-turbo takes
      # pass it honestly. Set to 1 only as an emergency bypass — a failing
      # preflight then turns into an OOM mid-generation.
      ACESTEP_SKIP_VRAM_PREFLIGHT: "${ACESTEP_SKIP_VRAM_PREFLIGHT:-0}"
      ACESTEP_CHECKPOINT_DIR: "/opt/acestep"
      AUDIO_OUTPUT_DIR: "/app/data/audio/worker_output"
      ACESTEP_LOG_DIR: "/opt/acestep/logs"
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_URL: "${ACESTEP_WORKER_CONTROL_PLANE_URL:-http://songmaker-web:8080}"
      SONGMAKER_INTERNAL_TOKEN: "${SONGMAKER_INTERNAL_TOKEN:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - ./vendor/acestep/checkpoints:/opt/acestep/checkpoints
      - audiofiles:/app/data/audio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  songmaker-scoring-worker:
    build:
      context: .
      dockerfile: docker/scoring-worker.Dockerfile
      secrets:
        - hf_token
    command: ["songmaker_cli.scoring_worker.ScoringWorkerSettings"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "scripts/arq_healthcheck.py", "scoring"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      SONGMAKER_INTERNAL_TOKEN: "${SONGMAKER_INTERNAL_TOKEN:-}"
      SCORING_DEVICE: "${SCORING_DEVICE:-cpu}"
      SCORING_MAX_JOBS: "${SCORING_MAX_JOBS:-1}"
      SCORER_TIMEOUT_SECONDS: "${SCORER_TIMEOUT_SECONDS:-120}"
      TEXT_ACCURACY_TIMEOUT_SECONDS: "${TEXT_ACCURACY_TIMEOUT_SECONDS:-300}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - audiofiles:/app/data/audio
      - hfcache:/app/.cache/huggingface/hub
      # Claude only: the judge uses Grok and Codex through their HTTP APIs,
      # so their subscription credentials do not belong in this container.
      - type: bind
        source: ${SONGMAKER_CLAUDE_CLI:-~/.local/bin/claude}
        target: /usr/local/bin/claude
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SONGMAKER_CLI_CREDENTIALS_DIR:-~/.songmaker/agent-cli-credentials}/claude.json
        target: /home/songmaker/.claude/.credentials.json
        read_only: true
        bind:
          create_host_path: false

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - promdata:/prometheus
    depends_on:
      songmaker-web:
        condition: service_healthy
      alertmanager:
        condition: service_started
    cap_drop:
      - ALL

  # Delivers the three alert.rules.yml conditions by email via Alertmanager's
  # own SMTP client (issue #333) — see monitoring/alertmanager.yml.template
  # for why this owns delivery instead of scripts/alert.sh or Grafana's
  # native alerting. Internal-only, same as prometheus above (no published
  # port): reached by Prometheus over the compose network, not by a human
  # browser directly.
  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    # Only the four non-secret values travel as environment (they are
    # readable in `docker inspect`, which for a hostname, a port and two
    # addresses is what they already are in .env.docker.example). The
    # password does NOT: it is mounted as the smtp_password secret below
    # and read by Alertmanager itself from /run/secrets/smtp_password
    # (smtp_auth_password_file in the template), so it never reaches this
    # container's environment, argv, or writable layer.
    environment:
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_USER: "${SMTP_USER:-}"
    secrets:
      - smtp_password
    volumes:
      - ./monitoring/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./monitoring/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanagerdata:/alertmanager
    # The image's own ENTRYPOINT is /bin/alertmanager; entrypoint: replaces
    # it entirely so the SMTP config can be assembled first (see
    # monitoring/alertmanager-entrypoint.sh, which then execs the real
    # binary). Confirmed against prom/alertmanager:latest that /bin/sh,
    # /bin/sed and /bin/amtool all exist in this image — no envsubst, sed
    # substitution instead, and amtool validates the result before the
    # daemon ever sees it.
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    # Without this, a container stuck in a config-error restart loop still
    # counts as "started" — `docker compose up --wait` would then wait on
    # it forever and wedge the auto-deploy tick holding the lock (issue
    # #333). Unhealthy is a state both `compose ps` and `--wait` can see.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    # Loopback only, same reason as songmaker-web above. Reach the dashboards
    # from another machine over an SSH tunnel, not over the LAN.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafdata:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    cap_drop:
      - ALL

secrets:
  hf_token:
    environment: HF_TOKEN
  # Mounted into the alertmanager container at /run/secrets/smtp_password
  # instead of being passed as an environment variable: a secret in
  # `environment:` is visible in `docker inspect` and `docker compose
  # config` for anyone on the host, and would additionally have to survive
  # a text substitution on its way into the config (issue #333).
  smtp_password:
    environment: SMTP_PASSWORD

volumes:
  pgdata:
  redisdata:
  audiofiles:
  queuestreams:
  hfcache:
  promdata:
  grafdata:
  alertmanagerdata:
