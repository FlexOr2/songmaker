services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-songmaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-songmaker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-songmaker}"]
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-songmaker}
    entrypoint: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"
    cap_drop:
      - ALL

  songmaker-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      GENERATION_RATE_LIMIT_USER: ${GENERATION_RATE_LIMIT_USER:-20}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SONGMAKER_INTERNAL_TOKEN: "${SONGMAKER_INTERNAL_TOKEN:-}"
      HOST: "0.0.0.0"
    ports:
      - "8080:8080"
    volumes:
      - audiofiles:/app/data/audio
      - queuestreams:/app/data/queue-streams
      - ~/.local/bin/claude:/usr/local/bin/claude:ro
      - ~/.claude:/home/songmaker/.claude
      - ~/.claude.json:/home/songmaker/.claude.json
    cap_drop:
      - ALL

  songmaker-music-worker:
    build:
      context: .
      dockerfile: docker/music-worker.Dockerfile
    command: ["songmaker_cli.music_worker.MusicWorkerSettings"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "scripts/arq_healthcheck.py", "music"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      MUSIC_MAX_JOBS: "${MUSIC_MAX_JOBS:-2}"
      ARQ_JOB_TIMEOUT: "${ARQ_JOB_TIMEOUT:-300}"
      SONGMAKER_INTERNAL_TOKEN: "${SONGMAKER_INTERNAL_TOKEN:-}"
    volumes:
      - audiofiles:/app/data/audio

  songmaker-acestep-worker-0:
    build:
      context: .
      dockerfile: docker/acestep-worker.Dockerfile
    runtime: nvidia
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      WORKER_ID: "acestep-worker-0"
      WORKER_HOST: "songmaker-acestep-worker-0"
      WORKER_PORT: "8001"
      GPU_ID: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
      VRAM_BUDGET_GB: "${ACESTEP_WORKER_VRAM_GB:-24}"
      ACESTEP_STARTUP_TIMEOUT_SECONDS: "${ACESTEP_STARTUP_TIMEOUT_SECONDS:-300}"
      ACESTEP_CHECKPOINT_DIR: "/opt/acestep"
      AUDIO_OUTPUT_DIR: "/app/data/audio/worker_output"
      ACESTEP_LOG_DIR: "/opt/acestep/logs"
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_URL: "${ACESTEP_WORKER_CONTROL_PLANE_URL:-http://songmaker-web:8080}"
      SONGMAKER_INTERNAL_TOKEN: "${SONGMAKER_INTERNAL_TOKEN:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - ./vendor/acestep/checkpoints:/opt/acestep/checkpoints
      - audiofiles:/app/data/audio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  songmaker-scoring-worker:
    build:
      context: .
      dockerfile: docker/scoring-worker.Dockerfile
      secrets:
        - hf_token
    command: ["songmaker_cli.scoring_worker.ScoringWorkerSettings"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "scripts/arq_healthcheck.py", "scoring"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      SONGMAKER_INTERNAL_TOKEN: "${SONGMAKER_INTERNAL_TOKEN:-}"
      SCORING_DEVICE: "${SCORING_DEVICE:-cpu}"
      SCORING_MAX_JOBS: "${SCORING_MAX_JOBS:-1}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - audiofiles:/app/data/audio
      - hfcache:/app/.cache/huggingface/hub

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      songmaker-web:
        condition: service_healthy
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafdata:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    cap_drop:
      - ALL

secrets:
  hf_token:
    environment: HF_TOKEN

volumes:
  pgdata:
  redisdata:
  audiofiles:
  queuestreams:
  hfcache:
  promdata:
  grafdata:
