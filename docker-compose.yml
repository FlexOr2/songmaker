services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-songmaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-songmaker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-songmaker}"]
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-songmaker}
    entrypoint: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"
    cap_drop:
      - ALL

  songmaker-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      GENERATION_RATE_LIMIT_USER: ${GENERATION_RATE_LIMIT_USER:-20}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SONGMAKER_INTERNAL_TOKEN: "${SONGMAKER_INTERNAL_TOKEN:-}"
      HOST: "0.0.0.0"
    # Published to the loopback interface only: Docker's NAT chain bypasses
    # the INPUT chain (and with it UFW), so a "8080:8080" binding reaches the
    # whole LAN regardless of the host firewall. Everything that needs this
    # port is host-local (the cloudflared tunnel, the Vite dev proxy, the
    # CLI); in-cluster callers use songmaker-web:8080 on the compose network,
    # which is unaffected.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - audiofiles:/app/data/audio
      - queuestreams:/app/data/queue-streams
      - ~/.local/bin/claude:/usr/local/bin/claude:ro
      - ~/.claude:/home/songmaker/.claude
      - ~/.claude.json:/home/songmaker/.claude.json
    cap_drop:
      - ALL

  songmaker-music-worker:
    build:
      context: .
      dockerfile: docker/music-worker.Dockerfile
    command: ["songmaker_cli.music_worker.MusicWorkerSettings"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "scripts/arq_healthcheck.py", "music"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      MUSIC_MAX_JOBS: "${MUSIC_MAX_JOBS:-2}"
      ARQ_JOB_TIMEOUT: "${ARQ_JOB_TIMEOUT:-300}"
      SONGMAKER_INTERNAL_TOKEN: "${SONGMAKER_INTERNAL_TOKEN:-}"
    volumes:
      - audiofiles:/app/data/audio

  songmaker-acestep-worker-0:
    build:
      context: .
      dockerfile: docker/acestep-worker.Dockerfile
    runtime: nvidia
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      WORKER_ID: "acestep-worker-0"
      WORKER_HOST: "songmaker-acestep-worker-0"
      WORKER_PORT: "8001"
      GPU_ID: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
      VRAM_BUDGET_GB: "${ACESTEP_WORKER_VRAM_GB:-24}"
      ACESTEP_STARTUP_TIMEOUT_SECONDS: "${ACESTEP_STARTUP_TIMEOUT_SECONDS:-300}"
      ACESTEP_LM_MODEL_PATH: "${ACESTEP_LM_MODEL_PATH:-acestep-5Hz-lm-4B}"
      # Empty means "use ACE-Step's own default": the GPU tier's
      # max_duration_with_lm, and a single sample per request.
      ACESTEP_LM_DIT_RESERVE_DURATION_S: "${ACESTEP_LM_DIT_RESERVE_DURATION_S:-}"
      ACESTEP_LM_DIT_RESERVE_BATCH: "${ACESTEP_LM_DIT_RESERVE_BATCH:-}"
      # The preflight is active again (#202): the fork's LM allocator now
      # keeps the DiT's duration-aware demand free, so long xl-turbo takes
      # pass it honestly. Set to 1 only as an emergency bypass — a failing
      # preflight then turns into an OOM mid-generation.
      ACESTEP_SKIP_VRAM_PREFLIGHT: "${ACESTEP_SKIP_VRAM_PREFLIGHT:-0}"
      ACESTEP_CHECKPOINT_DIR: "/opt/acestep"
      AUDIO_OUTPUT_DIR: "/app/data/audio/worker_output"
      ACESTEP_LOG_DIR: "/opt/acestep/logs"
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_URL: "${ACESTEP_WORKER_CONTROL_PLANE_URL:-http://songmaker-web:8080}"
      SONGMAKER_INTERNAL_TOKEN: "${SONGMAKER_INTERNAL_TOKEN:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - ./vendor/acestep/checkpoints:/opt/acestep/checkpoints
      - audiofiles:/app/data/audio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  songmaker-scoring-worker:
    build:
      context: .
      dockerfile: docker/scoring-worker.Dockerfile
      secrets:
        - hf_token
    command: ["songmaker_cli.scoring_worker.ScoringWorkerSettings"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "scripts/arq_healthcheck.py", "scoring"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-songmaker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-songmaker}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      SONGMAKER_INTERNAL_TOKEN: "${SONGMAKER_INTERNAL_TOKEN:-}"
      SCORING_DEVICE: "${SCORING_DEVICE:-cpu}"
      SCORING_MAX_JOBS: "${SCORING_MAX_JOBS:-1}"
      SCORER_TIMEOUT_SECONDS: "${SCORER_TIMEOUT_SECONDS:-120}"
      TEXT_ACCURACY_TIMEOUT_SECONDS: "${TEXT_ACCURACY_TIMEOUT_SECONDS:-300}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - audiofiles:/app/data/audio
      - hfcache:/app/.cache/huggingface/hub
      - ~/.local/bin/claude:/usr/local/bin/claude:ro
      - ~/.claude:/home/songmaker/.claude
      - ~/.claude.json:/home/songmaker/.claude.json

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - promdata:/prometheus
    depends_on:
      songmaker-web:
        condition: service_healthy
      alertmanager:
        condition: service_started
    cap_drop:
      - ALL

  # Delivers the three alert.rules.yml conditions by email via Alertmanager's
  # own SMTP client (issue #333) — see monitoring/alertmanager.yml.template
  # for why this owns delivery instead of scripts/alert.sh or Grafana's
  # native alerting. Internal-only, same as prometheus above (no published
  # port): reached by Prometheus over the compose network, not by a human
  # browser directly.
  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    environment:
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    volumes:
      - ./monitoring/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - alertmanagerdata:/alertmanager
    # The image's own ENTRYPOINT is /bin/alertmanager; entrypoint: replaces
    # it entirely so the SMTP config can be templated in first (see the
    # mounted template's header comment) instead of being appended as
    # arguments to it. Confirmed against prom/alertmanager:latest that
    # /bin/sh and /bin/sed both exist in this image — no envsubst, sed
    # substitution instead.
    #
    # Every $ below is doubled ($$) so docker-compose's OWN ${...}
    # substitution leaves it alone: without the escape, `docker compose
    # config`/`up` would bake the current .env values (including
    # SMTP_PASSWORD) as a literal string into this entrypoint at compose
    # time — visible in `docker inspect`/`docker compose config` output —
    # instead of the container's own shell reading them from its
    # environment: block at start, the way this is meant to work.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${ALERT_EMAIL_TO:-}" ] || [ -z "$${SMTP_HOST:-}" ] || [ -z "$${SMTP_PORT:-}" ] || [ -z "$${SMTP_USER:-}" ] || [ -z "$${SMTP_PASSWORD:-}" ]; then
          echo "alertmanager: missing ALERT_EMAIL_TO/SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASSWORD in .env -- refusing to start with an incomplete SMTP config" >&2
          exit 1
        fi
        sed \
          -e "s|__SMTP_HOST__|$$SMTP_HOST|g" \
          -e "s|__SMTP_PORT__|$$SMTP_PORT|g" \
          -e "s|__SMTP_USER__|$$SMTP_USER|g" \
          -e "s|__SMTP_PASSWORD__|$$SMTP_PASSWORD|g" \
          -e "s|__ALERT_EMAIL_TO__|$$ALERT_EMAIL_TO|g" \
          /etc/alertmanager/alertmanager.yml.template > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    # Loopback only, same reason as songmaker-web above. Reach the dashboards
    # from another machine over an SSH tunnel, not over the LAN.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafdata:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    cap_drop:
      - ALL

secrets:
  hf_token:
    environment: HF_TOKEN

volumes:
  pgdata:
  redisdata:
  audiofiles:
  queuestreams:
  hfcache:
  promdata:
  grafdata:
  alertmanagerdata:
