name: Requirement contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: requirements-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Offline requirement contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.x
        with:
          python-version: "3.12"

      - name: Check pull request against its exact base
        if: github.event_name == 'pull_request'
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_requirements.py --base-revision "$BASE_REVISION"

      - name: Check push against its exact before commit
        if: github.event_name == 'push'
        env:
          BASE_REVISION: ${{ github.event.before }}
        run: python scripts/check_requirements.py --base-revision "$BASE_REVISION"

      - name: Check current contract on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_requirements.py --current-only
