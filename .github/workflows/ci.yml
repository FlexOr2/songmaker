name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.x
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Cache uv packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.x
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --frozen --extra server --extra dev --extra mcp # NOSONAR: the local editable Songmaker project has no wheel; third-party dependencies are frozen in uv.lock.

      - name: Show installed FastAPI version
        run: uv run python -c "import fastapi; print(f'FastAPI {fastapi.__version__}')" # NOSONAR: uv sync above installs FastAPI from the committed uv.lock.

      - name: Ruff lint
        run: uv run ruff check src/ tests/ # NOSONAR: uv sync above installs Ruff from the committed uv.lock.

      - name: No silent-fallback smell check
        run: uv run python scripts/check_no_silent_fallbacks.py src/ # NOSONAR: dependencies come from the committed uv.lock.

      - name: Check TypeScript types in sync
        run: uv run python scripts/generate_types.py --check # NOSONAR: dependencies come from the committed uv.lock.

      - name: Run tests with coverage
        run: |
          set -o pipefail
          uv run pytest tests/ -n auto -q --tb=short --cov=songmaker_cli --cov=audio_engine --cov=acestep_engine --cov=acestep_worker --cov-report=term-missing --cov-fail-under=90 --cov-config=.coveragerc-ci | tee pytest-output.txt # NOSONAR: uv sync above installs Pytest and coverage tools from the committed uv.lock.

      - name: Coverage summary
        if: always()
        run: |
          total=$(grep '^TOTAL' pytest-output.txt | awk '{print $NF}')
          passed=$(grep -oP '^\d+ passed' pytest-output.txt | awk '{print $1}')
          skipped=$(grep -oP '\d+ skipped' pytest-output.txt | awk '{print $1}')
          echo "### Backend: ${passed} passed, ${skipped:-0} skipped — ${total} coverage" >> "$GITHUB_STEP_SUMMARY"

  acceptance-evidence:
    name: Acceptance evidence (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.x
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --frozen --extra server --extra dev --extra mcp # NOSONAR: the local editable Songmaker project has no wheel; third-party dependencies are frozen in uv.lock.

      - name: Show installed FastAPI version
        run: uv run python -c "import fastapi; print(f'FastAPI {fastapi.__version__}')" # NOSONAR: uv sync above installs FastAPI from the committed uv.lock.

      - name: Run acceptance evidence pilot
        id: evidence
        run: |
          report=artifacts/acceptance-evidence.json
          rm -f "$report"
          set +e
          uv run --no-sync --frozen --no-build python scripts/acceptance_evidence.py run --output "$report"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify acceptance evidence report
        if: always()
        run: |
          report=artifacts/acceptance-evidence.json
          test -s "$report"
          sha256sum "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD | sed 's/^/Acceptance evidence HEAD: /' >> "$GITHUB_STEP_SUMMARY"
          test "${{ steps.evidence.outputs.status }}" = "0"

      - name: Upload acceptance evidence report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.x
        with:
          name: acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/acceptance-evidence.json
          if-no-files-found: error
          retention-days: 30

  alert-rules:
    name: Alert rules (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x

      # The rules are Prometheus' own schema, so Prometheus' own tool is
      # the only honest checker — and it comes in the same image the
      # compose stack runs, rather than as a second thing to install.
      # `test rules` drives monitoring/alert.rules.test.yml against the
      # real rule file (issue #333).
      - name: Check and unit-test the alert rules
        run: |
          run_promtool() {
            docker run --rm -v "$PWD/monitoring:/monitoring:ro" -w /monitoring \
              --entrypoint promtool prom/prometheus:latest "$@"
          }
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:latest check config /etc/prometheus/prometheus.yml
          run_promtool check rules rules/alert.rules.yml
          run_promtool test rules alert.rules.test.yml

  postgresql-contract:
    name: PostgreSQL contract (serial)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: songmaker
          POSTGRES_PASSWORD: songmaker # NOSONAR: disposable password for this isolated GitHub Actions service container.
          POSTGRES_DB: songmaker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songmaker -d songmaker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://songmaker:songmaker@localhost:5432/songmaker_test # NOSONAR: disposable password for this isolated GitHub Actions service container.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.x
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install dependencies
        run: uv sync --frozen --extra server --extra dev # NOSONAR: the local editable Songmaker project has no wheel; third-party dependencies are frozen in uv.lock.
      - name: Show installed FastAPI version
        run: uv run python -c "import fastapi; print(f'FastAPI {fastapi.__version__}')" # NOSONAR: uv sync above installs FastAPI from the committed uv.lock.
      - name: Run PostgreSQL contracts serially
        run: uv run pytest tests/test_postgresql.py -n 0 -q --tb=short # NOSONAR: uv sync above installs Pytest from the committed uv.lock.

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.x
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.x
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Tests with coverage
        run: |
          set -o pipefail
          pnpm test:coverage | tee vitest-output.txt

      - name: Production build
        run: pnpm build

      - name: Test summary
        if: always()
        run: |
          line=$(grep -E '^\s*Tests\s' vitest-output.txt || echo 'Tests  ? passed')
          cov=$(grep -E 'Statements\s*:' vitest-output.txt | tail -1 || true)
          echo "### Frontend: ${line}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$cov" ]; then echo "### Coverage: ${cov}" >> "$GITHUB_STEP_SUMMARY"; fi
