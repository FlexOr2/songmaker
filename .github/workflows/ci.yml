name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -e ".[server,dev,mcp]" pytest-cov

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: No silent-fallback smell check
        run: python scripts/check_no_silent_fallbacks.py src/

      - name: Check TypeScript types in sync
        run: python scripts/generate_types.py --check

      - name: Run tests with coverage
        run: |
          set -o pipefail
          pytest tests/ -n auto -q --tb=short \
            --cov=songmaker_cli --cov=audio_engine --cov=acestep_engine --cov=acestep_worker \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --cov-config=.coveragerc-ci | tee pytest-output.txt

      - name: Coverage summary
        if: always()
        run: |
          total=$(grep '^TOTAL' pytest-output.txt | awk '{print $NF}')
          passed=$(grep -oP '^\d+ passed' pytest-output.txt | awk '{print $1}')
          skipped=$(grep -oP '\d+ skipped' pytest-output.txt | awk '{print $1}')
          echo "### Backend: ${passed} passed, ${skipped:-0} skipped — ${total} coverage" >> "$GITHUB_STEP_SUMMARY"

  acceptance-evidence:
    name: Acceptance evidence (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[server,dev,mcp]"

      - name: Run acceptance evidence pilot
        id: evidence
        run: |
          report=artifacts/acceptance-evidence.json
          rm -f "$report"
          set +e
          python scripts/acceptance_evidence.py run --output "$report"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify acceptance evidence report
        if: always()
        run: |
          report=artifacts/acceptance-evidence.json
          test -s "$report"
          sha256sum "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD | sed 's/^/Acceptance evidence HEAD: /' >> "$GITHUB_STEP_SUMMARY"
          test "${{ steps.evidence.outputs.status }}" = "0"

      - name: Upload acceptance evidence report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/acceptance-evidence.json
          if-no-files-found: error
          retention-days: 30

  postgresql-contract:
    name: PostgreSQL contract (serial)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: songmaker
          POSTGRES_PASSWORD: songmaker
          POSTGRES_DB: songmaker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songmaker -d songmaker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://songmaker:songmaker@localhost:5432/songmaker_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[server,dev]"
      - name: Run PostgreSQL contracts serially
        run: pytest tests/test_postgresql.py -n 0 -q --tb=short

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Tests with coverage
        run: |
          set -o pipefail
          pnpm test:coverage | tee vitest-output.txt

      - name: Production build
        run: pnpm build

      - name: Test summary
        if: always()
        run: |
          line=$(grep -E '^\s*Tests\s' vitest-output.txt || echo 'Tests  ? passed')
          cov=$(grep -E 'Statements\s*:' vitest-output.txt | tail -1 || true)
          echo "### Frontend: ${line}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$cov" ]; then echo "### Coverage: ${cov}" >> "$GITHUB_STEP_SUMMARY"; fi
