name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -e ".[server,dev]" pytest-cov

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: No silent-fallback smell check
        run: python scripts/check_no_silent_fallbacks.py src/

      - name: Check TypeScript types in sync
        run: python scripts/generate_types.py --check

      - name: Run tests with coverage
        run: |
          set -o pipefail
          pytest tests/ -n auto -q --tb=short \
            --cov=songmaker_cli --cov=audio_engine --cov=acestep_engine \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --cov-config=.coveragerc-ci | tee pytest-output.txt

      - name: Coverage summary
        if: always()
        run: |
          total=$(grep '^TOTAL' pytest-output.txt | awk '{print $NF}')
          passed=$(grep -oP '^\d+ passed' pytest-output.txt | awk '{print $1}')
          skipped=$(grep -oP '\d+ skipped' pytest-output.txt | awk '{print $1}')
          echo "### Backend: ${passed} passed, ${skipped:-0} skipped — ${total} coverage" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: |
          set -o pipefail
          pnpm test | tee vitest-output.txt

      - name: Test summary
        if: always()
        run: |
          line=$(grep -E '^\s*Tests\s' vitest-output.txt || echo 'Tests  ? passed')
          echo "### Frontend: ${line}" >> "$GITHUB_STEP_SUMMARY"
