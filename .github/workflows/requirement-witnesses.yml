name: Requirement witnesses

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  issue_comment:
    types: [edited, deleted]

permissions:
  contents: read
  issues: read

concurrency:
  group: requirement-witnesses-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Live requirement witnesses
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.x
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.x
        with:
          python-version: "3.12"

      - name: Re-fetch approval witnesses from GitHub
        run: timeout --signal=TERM --kill-after=5s 120s python scripts/check_requirement_witnesses.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
