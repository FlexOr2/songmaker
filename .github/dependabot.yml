version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5
    # frontend/package.json pins pnpm.overrides.cookie to 1.1.1: @sveltejs/kit's
    # loose `cookie: '>=0.7.0'` range lets pnpm resolve cookie 2.x, which
    # renamed parse/serialize and breaks `pnpm build` against kit's runtime
    # import (no fixed kit release exists yet — see PR #130/issue #112).
    # Not a dependabot ignore: kit itself isn't a major bump, so there is no
    # matching semver-major rule to add here.
    ignore:
      # TypeScript 7 needs svelte-check's dual TS6+TS7 --tsgo setup
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # prettier-plugin-svelte 4.x reformats existing .svelte/.ts files,
      # breaking `prettier --check .` in CI (see PR #109)
      - dependency-name: "prettier-plugin-svelte"
        update-types: ["version-update:semver-major"]
      # vitest 4 invokes `new` on vi.fn() arrow implementations, breaking
      # Audio-mock stubs (`new Audio()` throws "not a constructor") in ~7
      # frontend test files (see PR #114, issue #112)
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # Vite 8 (rolldown build errors — see #114 run log)
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/vite-plugin-svelte"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
