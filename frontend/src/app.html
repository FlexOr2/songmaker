<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Songmaker</title>
		<script>
			(function () {
				var t = localStorage.getItem('theme') || 'dark';
				document.documentElement.dataset.theme = t;
				if (typeof window.matchMedia !== 'function') {
					document.documentElement.dataset.pointer = 'fine';
					return;
				}
				var mq = window.matchMedia('(any-pointer: coarse)');
				function applyPointer() {
					document.documentElement.dataset.pointer = mq.matches ? 'coarse' : 'fine';
				}
				applyPointer();
				if (mq.addEventListener) mq.addEventListener('change', applyPointer);
				else if (mq.addListener) mq.addListener(applyPointer);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
