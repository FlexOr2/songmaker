[project]
name = "songmaker"
version = "1.0.0"
description = "AI-powered song generation engine — songs from markdown files"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=2.4.4,<3",
    "scipy>=1.17.1,<2",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.13.1,<3",
    "cyclopts>=4.10.2,<5",
    "pyloudnorm>=0.2.0,<1",
    "httpx>=0.28.1,<1",
    "python-slugify>=8.0.4,<9",
]

[project.optional-dependencies]
scoring = [
    "librosa>=0.11.0,<1",
    "soundfile",
    "audiobox-aesthetics>=0.0.4,<1",
    "torch>=2.11.0,<3",
    "nvidia-ml-py3>=7.352,<8",
]
whisper = [
    "faster-whisper>=1.2.1,<2",
    "torch>=2.11.0,<3",
    "soundfile",
    "librosa>=0.11.0,<1",
    "numba",
]
server = [
    "fastapi>=0.135.3,<1",
    "uvicorn>=0.44.0,<1",
    "sqlalchemy>=2.0.49,<3",
    "alembic>=1.18.4,<2",
    "bcrypt>=5.0.0,<6",
    "python-dotenv>=1.2.2,<2",
    "structlog>=25.5.0,<26",
    "redis[hiredis]>=7.4.0,<8",
    "psycopg2-binary>=2.9.11,<3",
    "arq>=0.27.0,<1",
    "mutagen>=1.47,<2",
    "python-multipart>=0.0.26,<1",
]
claude = [
    "anthropic>=0.94.0,<1",
]
acestep-worker = [
    "fastapi>=0.135.3,<1",
    "uvicorn>=0.44.0,<1",
    "redis[hiredis]>=7.4.0,<8",
    "huggingface_hub>=1.10.1,<2",
    "nvidia-ml-py3>=7.352,<8",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15.10,<1",
    "fakeredis[lua]>=2.35.0,<3",
]

[project.scripts]
songmaker = "songmaker_cli.main:main"

[project.urls]
Repository = "https://github.com/flex0r/songmaker"

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "acestep_engine*",
    "acestep_worker*",
    "audio_engine*",
    "songmaker_cli*",
]

# ---------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------
[tool.uv]
override-dependencies = [
    "numpy>=1.26",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

# ---------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"vulture_whitelist.py" = ["E402", "I001"]
"tests/test_scorers.py" = ["E402", "I001"]
"tests/test_scorers_extended.py" = ["E402", "I001"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert in tests
    "B310",  # urlopen — URLs are from config, not user input
    "B404",  # subprocess import — required for ffmpeg and ACE-Step
    "B603",  # subprocess without shell — intentional, uses list args
    "B110",  # try/except/pass — used in cleanup paths (GPU, subprocess, model unload)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto"

# ---------------------------------------------------------------
# External tools (must be on system PATH):
#   ffmpeg      — MP3 encoding
# ---------------------------------------------------------------
