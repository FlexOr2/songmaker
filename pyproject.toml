[project]
name = "songmaker"
version = "1.0.0"
description = "AI-powered song generation engine — songs from markdown files"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"

dependencies = [
    # Core audio processing
    "numpy>=1.26",
    "scipy>=1.12",

    # Deep learning runtime (CUDA version resolved via tool.uv index)
    "torch>=2.2",
    "torchaudio>=2.2",

    # Audio utilities
    "soundfile",
    "librosa",
    "numba",
    "pydantic",
]

[project.optional-dependencies]
# Development / testing
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
songmaker = "songmaker_cli.main:main"

[project.urls]
Repository = "https://github.com/flex0r/songmaker"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["source_files"]
include = [
    "acestep_engine*",
    "bark_engine*",
    "instrumental_engine*",
    "songmaker_cli*",
]

# ---------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------
[tool.uv]
override-dependencies = [
    "numpy>=1.26",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

# ---------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"vulture_whitelist.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source_files"]

# ---------------------------------------------------------------
# External tools (must be on system PATH):
#   ffmpeg      — MP3 encoding, vocal filtering
#   FluidSynth  — SoundFont instrument rendering (optional)
#
# SoundFonts:
#   python scripts/download_soundfonts.py
# ---------------------------------------------------------------
