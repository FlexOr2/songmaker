[project]
name = "songmaker"
version = "1.0.0"
description = "AI-powered song generation engine — songs from markdown files"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.0",
    "cyclopts>=4.0",
    "pyloudnorm>=0.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
scoring = [
    "librosa>=0.10",
    "soundfile",
    "audiobox-aesthetics>=0.0.4",
    "torch>=2.2",
]
whisper = [
    "openai-whisper",
    "torch>=2.2",
    "torchaudio>=2.2",
    "soundfile",
    "librosa",
    "numba",
]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "bcrypt>=4.0",
    "python-dotenv>=1.0",
]
claude = [
    "anthropic>=0.20",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=7.0",
    "ruff>=0.4",
]

[project.scripts]
songmaker = "songmaker_cli.main:main"

[project.urls]
Repository = "https://github.com/flex0r/songmaker"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "acestep_engine*",
    "audio_engine*",
    "songmaker_cli*",
]

# ---------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------
[tool.uv]
override-dependencies = [
    "numpy>=1.26",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

# ---------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"vulture_whitelist.py" = ["E402", "I001"]
"tests/test_scorers.py" = ["E402", "I001"]
"tests/test_scorers_extended.py" = ["E402", "I001"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert in tests
    "B310",  # urlopen — URLs are from config, not user input
    "B404",  # subprocess import — required for ffmpeg and ACE-Step
    "B603",  # subprocess without shell — intentional, uses list args
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ---------------------------------------------------------------
# External tools (must be on system PATH):
#   ffmpeg      — MP3 encoding
# ---------------------------------------------------------------
