sonar.organization=overnightworks
sonar.projectKey=overnightworks_songmaker
sonar.sources=src,frontend/src
sonar.tests=tests,frontend
sonar.test.inclusions=tests/**,frontend/src/**/*.test.ts,frontend/e2e/**
sonar.exclusions=vendor/**,docs/design/**,frontend/e2e/test-results/**,frontend/playwright-report/**,plans/**,**/node_modules/**,**/.svelte-kit/**,frontend/build/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# The `sonar` job in .github/workflows/ci.yml downloads these reports from
# the backend and frontend jobs before scanning (#679).
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.javascript.lcov.reportPaths=reports/frontend-coverage/lcov.info

# The scanner cannot infer these project-specific build guarantees (#679).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4

# why: local and vendored projects require their frozen source builds.
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile*

# why: uv resolves from the committed, frozen lockfile; required source builds
# are additionally constrained by the lockfile's hashes.
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Dockerfile*

# why: test fixtures intentionally use yield-shaped setup for pytest's fixture
# protocol; without teardown, S9100 adds style noise without product value.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S9100
sonar.issue.ignore.multicriteria.e3.resourceKey=tests/**

# why: Docker layers are intentionally separate for install, cache, permission,
# and model-warmup boundaries; merging them would reduce operational clarity.
sonar.issue.ignore.multicriteria.e4.ruleKey=docker:S7031
sonar.issue.ignore.multicriteria.e4.resourceKey=**/Dockerfile*
