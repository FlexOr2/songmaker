# CI override for docker-compose.yml — boots only the web-facing services
# (no GPU, no monitoring) so the stack fits an ubuntu-latest runner.
# `profiles: [gpu]` keeps the GPU/monitoring services out of both
# `docker compose config` and `up` without needing to delete them here.
x-gha-cache: &gha_cache
  cache_from:
    - type=gha
  cache_to:
    - type=gha,mode=max

services:
  prometheus:
    profiles: ["gpu"]
  grafana:
    profiles: ["gpu"]
  songmaker-acestep-worker-0:
    profiles: ["gpu"]
  songmaker-music-worker:
    profiles: ["gpu"]
  songmaker-scoring-worker:
    profiles: ["gpu"]

  migrate:
    build:
      <<: *gha_cache

  songmaker-web:
    build:
      <<: *gha_cache
    # CI runs four Playwright specs sequentially from one runner IP inside a
    # single 60s window (login/seeding plus the specs' own /api budgets add
    # up to ~96 requests/min per e2e/README.md) — a real production default
    # of 120/min 429s pure /api traffic here even though media and stream
    # requests now sit in their own budgets since #278. 300 covers that
    # single-IP burst without touching the production default. Grow this
    # number if the e2e suite gains more specs.
    environment:
      IP_RATE_LIMIT: "300"
    ports: !override
      - "${WEB_PORT:-8080}:8080"
    # !override drops the host Claude-CLI bind mounts — CI has no host
    # Claude credentials and must not depend on the operator's machine.
    volumes: !override
      - audiofiles:/app/data/audio
      - queuestreams:/app/data/queue-streams
