# CI override for docker-compose.yml — boots only the web-facing services
# (no GPU, no monitoring) so the stack fits an ubuntu-latest runner.
# `profiles: [gpu]` keeps the GPU/monitoring services out of both
# `docker compose config` and `up` without needing to delete them here.
x-gha-cache: &gha_cache
  cache_from:
    - type=gha
  cache_to:
    - type=gha,mode=max

services:
  prometheus:
    profiles: ["gpu"]
  grafana:
    profiles: ["gpu"]
  songmaker-acestep-worker-0:
    profiles: ["gpu"]
  songmaker-music-worker:
    profiles: ["gpu"]
  songmaker-scoring-worker:
    profiles: ["gpu"]

  migrate:
    build:
      <<: *gha_cache

  songmaker-web:
    build:
      <<: *gha_cache
    # CI runs four Playwright specs sequentially from one runner IP inside a
    # single 60s window (login/seeding plus the specs' own /api budgets add
    # up to ~96 requests/min per e2e/README.md) — a real production default
    # of 120/min 429s pure /api traffic here even though media and stream
    # requests now sit in their own budgets since #278. 300 covers that
    # single-IP burst without touching the production default. Grow this
    # number if the e2e suite gains more specs.
    #
    # The resource-events stream's own open-connection limit is keyed per
    # *user*, not per IP (issue #294) — and every browser context the e2e
    # suite opens reuses the one seeded admin account from global-setup, so
    # every stream open across the whole suite is additive against this one
    # user's budget the way it never is in production with many real users.
    # Counted directly from the suite (each `page.goto` to an authenticated
    # route opens the stream once): album-address.spec.ts is 5 (three single
    # cold opens, plus the legacy-bookmark test's two full page loads),
    # playlist-address.spec.ts is 2 (one cold open each), and library.spec.ts
    # is 1 per shell (desktop + mobile) since its public-link step opens a
    # separate logged-out context that never touches this stream — 5 + 2 + 2
    # = 9 against the unconfigurable production default of 12, which is why
    # one more standalone stream-opening test tipped the suite over it during
    # #263. 30 gives roughly 3x headroom over that measured 9, the same
    # multiple `media_rate_limit`'s own comment uses. Grow this number if the
    # e2e suite gains more specs that open the stream.
    environment:
      IP_RATE_LIMIT: "300"
      RESOURCE_EVENT_STREAM_OPEN_LIMIT: "30"
    ports: !override
      - "${WEB_PORT:-8080}:8080"
    # !override drops the host Claude-CLI bind mounts — CI has no host
    # Claude credentials and must not depend on the operator's machine.
    volumes: !override
      - audiofiles:/app/data/audio
      - queuestreams:/app/data/queue-streams
