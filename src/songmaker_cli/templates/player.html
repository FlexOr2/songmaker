<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ARTIST}} — Music Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Open+Sans:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #ff3220;
    --bg: #0d0d0d;
  }

  html, body {
    background: var(--bg);
    color: #e0e0e0;
    font-family: 'Open Sans', Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  .header {
    text-align: center;
    padding: 12px 20px 8px;
    border-bottom: 2px solid var(--primary);
    flex-shrink: 0;
  }

  .header h1 {
    font-family: 'Oswald', Impact, sans-serif;
    font-size: 32px;
    color: var(--primary);
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .header .subtitle {
    color: #888;
    font-size: 12px;
    margin-top: 2px;
  }

  .album-nav {
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 8px 20px;
    background: #111;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .album-btn {
    background: #1a1a1a;
    border: 2px solid #333;
    color: #aaa;
    padding: 5px 16px;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .album-btn:hover {
    border-color: var(--primary);
    color: #fff;
  }

  .album-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .track-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    padding: 6px 20px;
    background: #0f0f0f;
    flex-shrink: 0;
  }

  .track-btn {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #777;
    padding: 4px 12px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .track-btn:hover {
    border-color: var(--primary);
    color: #ccc;
  }

  .track-btn.active {
    background: rgba(255,255,255,0.1);
    border-color: var(--primary);
    color: #fff;
  }

  .player-area {
    max-width: 800px;
    margin: 0 auto;
    padding: 8px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    width: 100%;
  }

  .now-playing {
    text-align: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }

  .now-playing .track-number {
    font-family: 'Oswald', sans-serif;
    color: var(--primary);
    font-size: 16px;
  }

  .now-playing .track-title {
    font-family: 'Oswald', sans-serif;
    color: #fff;
    font-size: 24px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .now-playing .track-meta {
    color: #666;
    font-size: 12px;
    margin-top: 2px;
  }

  .audio-player {
    width: 100%;
    margin: 6px 0;
    flex-shrink: 0;
    height: 40px;
  }

  .lyrics-container {
    padding: 8px 0;
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
    min-height: 0;
  }

  .lyric-line {
    padding: 6px 16px;
    margin: 3px 0;
    font-size: 17px;
    line-height: 1.5;
    color: #444;
    transition: all 0.3s ease;
    border-left: 3px solid transparent;
    cursor: pointer;
  }

  .lyric-line:hover { color: #999; }

  .lyric-line.active {
    color: #fff;
    font-size: 19px;
    border-left-color: var(--primary);
    background: rgba(255, 255, 255, 0.03);
  }

  .lyric-line.past { color: #666; }

  .lyric-line.section-tag {
    color: var(--primary);
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0.6;
    cursor: default;
    padding: 10px 16px 2px;
  }

  .lyric-line .timestamp {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    color: var(--primary);
    margin-right: 8px;
    opacity: 0.5;
  }

  .no-lyrics {
    text-align: center;
    color: #444;
    font-style: italic;
    padding: 40px 20px;
  }

  .view-toggle {
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 4px 0;
    flex-shrink: 0;
  }

  .view-btn {
    background: none;
    border: 1px solid #333;
    color: #666;
    padding: 2px 12px;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .view-btn:hover { color: #aaa; border-color: #555; }

  .view-btn.active {
    color: var(--primary);
    border-color: var(--primary);
  }

  .diff-line {
    padding: 4px 16px;
    margin: 2px 0;
    font-size: 14px;
    line-height: 1.4;
    font-family: 'Open Sans', monospace;
  }

  .diff-line.match { color: #4a4; }
  .diff-line.intended { color: #888; text-decoration: line-through; }
  .diff-line.sung { color: var(--primary); }
  .diff-line.section { color: #555; font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 1px; padding-top: 8px; }

  .rating-panel {
    background: #111;
    border: 1px solid #222;
    border-radius: 6px;
    padding: 10px 16px;
    margin: 8px 0;
    flex-shrink: 0;
  }

  .rating-panel h3 {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .rating-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .rating-label {
    font-size: 12px;
    color: #888;
    width: 90px;
    flex-shrink: 0;
  }

  .stars {
    display: flex;
    gap: 2px;
  }

  .star {
    font-size: 20px;
    cursor: pointer;
    color: #333;
    transition: color 0.15s;
    user-select: none;
  }

  .star:hover, .star.active { color: var(--primary); }
  .stars:hover .star { color: #333; }
  .stars:hover .star:hover, .stars:hover .star:hover ~ .star-reverse { color: var(--primary); }
  .stars .star.active ~ .star:not(.active) { color: #333; }

  .rating-comment {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #ccc;
    padding: 6px 10px;
    font-family: 'Open Sans', sans-serif;
    font-size: 12px;
    border-radius: 4px;
    resize: none;
    margin-top: 4px;
  }

  .rating-comment:focus { border-color: var(--primary); outline: none; }

  .rating-actions {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    align-items: center;
  }

  .rating-save {
    background: var(--primary);
    border: none;
    color: #fff;
    padding: 4px 14px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 3px;
  }

  .rating-export {
    background: none;
    border: 1px solid #444;
    color: #888;
    padding: 4px 14px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 3px;
  }

  .rating-export:hover { border-color: var(--primary); color: #ccc; }

  .rating-status {
    font-size: 11px;
    color: #4a4;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .rating-status.show { opacity: 1; }

  .track-btn .rating-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-left: 4px;
    vertical-align: middle;
  }

  .footer {
    text-align: center;
    padding: 6px;
    color: #333;
    font-size: 11px;
    flex-shrink: 0;
    border-top: 1px solid #1a1a1a;
  }

  .lyrics-container::-webkit-scrollbar { width: 5px; }
  .lyrics-container::-webkit-scrollbar-track { background: #111; }
  .lyrics-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

  @media (max-width: 600px) {
    .header h1 { font-size: 24px; }
    .now-playing .track-title { font-size: 18px; }
    .lyric-line { font-size: 15px; padding: 5px 12px; }
    .lyric-line.active { font-size: 16px; }
    .album-btn, .track-btn { padding: 4px 10px; font-size: 11px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="albumTitle">{{ARTIST}}</h1>
  <div class="subtitle" id="albumSubtitle">Music Player</div>
</div>

<div class="album-nav" id="albumNav"></div>
<div class="track-nav" id="trackNav"></div>

<div class="player-area">
  <div class="now-playing">
    <div class="track-number" id="trackNumber"></div>
    <div class="track-title" id="trackTitle"></div>
    <div class="track-meta" id="trackMeta"></div>
  </div>

  <audio id="audioPlayer" class="audio-player" controls preload="metadata">
    <source id="audioSource" type="audio/mpeg">
  </audio>

  <div class="rating-panel" id="ratingPanel">
    <h3>Rate this version</h3>
    <div class="rating-row">
      <span class="rating-label">Overall</span>
      <div class="stars" id="stars-overall"></div>
    </div>
    <div class="rating-row">
      <span class="rating-label">Rhythm</span>
      <div class="stars" id="stars-rhythm"></div>
    </div>
    <div class="rating-row">
      <span class="rating-label">Text Accuracy</span>
      <div class="stars" id="stars-text"></div>
    </div>
    <div class="rating-row">
      <span class="rating-label">Vocals</span>
      <div class="stars" id="stars-vocals"></div>
    </div>
    <textarea class="rating-comment" id="ratingComment" rows="2" placeholder="Notes..."></textarea>
    <div class="rating-actions">
      <button class="rating-save" onclick="saveRating()">Save</button>
      <button class="rating-export" onclick="exportRatings()">Export All</button>
      <span class="rating-status" id="ratingStatus">Saved!</span>
    </div>
  </div>

  <div class="view-toggle" id="viewToggle" style="display:none">
    <button class="view-btn active" id="btnSung" onclick="switchView('sung')">Sung</button>
    <button class="view-btn" id="btnIntended" onclick="switchView('intended')">Intended</button>
    <button class="view-btn" id="btnDiff" onclick="switchView('diff')">Diff</button>
  </div>

  <div class="lyrics-container" id="lyricsContainer"></div>
</div>

<div class="footer">
  AI Generated &bull; {{ARTIST}} &bull; {{YEAR}}
</div>

<script>
const INLINE_MANIFEST = {{MANIFEST_JSON}};
let ALBUMS = [];
let currentAlbum = 0;
let currentTrack = 0;
let currentView = 'sung';
let manifestHash = '';

const audioEl = document.getElementById('audioPlayer');
const sourceEl = document.getElementById('audioSource');
const lyricsContainer = document.getElementById('lyricsContainer');
const trackNumber = document.getElementById('trackNumber');
const trackTitle = document.getElementById('trackTitle');
const trackMeta = document.getElementById('trackMeta');
const albumTitle = document.getElementById('albumTitle');
const albumSubtitle = document.getElementById('albumSubtitle');
const albumNav = document.getElementById('albumNav');
const trackNav = document.getElementById('trackNav');

// --- Load manifest.json and initialize ---

async function loadManifest() {
  try {
    const resp = await fetch('manifest.json', {cache: 'no-store'});
    const text = await resp.text();
    const hash = simpleHash(text);
    if (hash === manifestHash) return false; // No change
    manifestHash = hash;
    const data = JSON.parse(text);
    ALBUMS = data.albums || [];
    return true;
  } catch(e) {
    // file:// protocol: fall back to inline manifest
    if (INLINE_MANIFEST && !manifestHash) {
      ALBUMS = INLINE_MANIFEST.albums || [];
      manifestHash = 'inline';
      return true;
    }
    return false;
  }
}

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  }
  return String(h);
}

async function init() {
  const loaded = await loadManifest();
  if (!loaded || ALBUMS.length === 0) {
    lyricsContainer.innerHTML = '<div class="no-lyrics">No manifest.json found. Generate a song first.</div>';
    return;
  }
  buildAlbumNav();
  loadAlbum(0);
}

// --- Auto-refresh: poll manifest.json every 3s ---

setInterval(async () => {
  const wasPlaying = audioEl && !audioEl.paused;
  const currentTime = audioEl ? audioEl.currentTime : 0;
  const prevAlbumId = ALBUMS[currentAlbum] ? ALBUMS[currentAlbum].id : null;
  const prevTrackFile = ALBUMS[currentAlbum] && ALBUMS[currentAlbum].tracks[currentTrack]
    ? ALBUMS[currentAlbum].tracks[currentTrack].file : null;

  const changed = await loadManifest();
  if (!changed) return;

  // Rebuild UI
  buildAlbumNav();

  // Try to restore position
  let restoredAlbum = 0;
  let restoredTrack = 0;
  if (prevAlbumId) {
    const ai = ALBUMS.findIndex(a => a.id === prevAlbumId);
    if (ai >= 0) {
      restoredAlbum = ai;
      if (prevTrackFile) {
        const ti = ALBUMS[ai].tracks.findIndex(t => t.file === prevTrackFile);
        if (ti >= 0) restoredTrack = ti;
      }
    }
  }

  loadAlbum(restoredAlbum, restoredTrack);

  // Restore playback if was playing
  if (wasPlaying && prevTrackFile === (ALBUMS[restoredAlbum]?.tracks[restoredTrack]?.file)) {
    audioEl.currentTime = currentTime;
    audioEl.play().catch(() => {});
  }
}, 3000);

// --- Read ID3 tags from MP3 via jsmediatags ---

function readID3(trackUrl) {
  return new Promise((resolve) => {
    if (typeof jsmediatags === 'undefined') {
      resolve(null);
      return;
    }
    jsmediatags.read(trackUrl, {
      onSuccess: (result) => resolve(result.tags),
      onError: () => resolve(null),
    });
  });
}

// --- UI Building ---

function setTheme(colors) {
  document.documentElement.style.setProperty('--primary', colors.primary);
  document.documentElement.style.setProperty('--bg', colors.bg);
}

function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function buildAlbumNav() {
  albumNav.innerHTML = '';
  ALBUMS.forEach((album, i) => {
    const btn = document.createElement('button');
    btn.className = 'album-btn' + (i === currentAlbum ? ' active' : '');
    btn.textContent = album.title;
    btn.onclick = () => loadAlbum(i);
    btn.id = 'album-btn-' + i;
    albumNav.appendChild(btn);
  });
}

function buildTrackNav(album) {
  trackNav.innerHTML = '';
  album.tracks.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'track-btn' + (i === 0 ? ' active' : '');
    let label = t.number + ' ' + t.title;
    // Show rating dot if rated
    const rKey = 'rating:' + t.file;
    try {
      const r = JSON.parse(localStorage.getItem(rKey) || '{}');
      if (r.overall) {
        const colors = ['', '#ff3333', '#ff8833', '#ffcc00', '#88cc33', '#33cc33'];
        label += ' <span class="rating-dot" style="background:' + colors[r.overall] + '"></span>';
      }
    } catch(e) {}
    btn.innerHTML = label;
    btn.onclick = () => loadTrack(i);
    btn.id = 'track-btn-' + i;
    trackNav.appendChild(btn);
  });
}

function loadAlbum(index, trackIndex) {
  currentAlbum = index;
  currentTrack = 0;
  const album = ALBUMS[index];

  document.querySelectorAll('.album-btn').forEach((btn, i) => {
    btn.className = 'album-btn' + (i === index ? ' active' : '');
  });

  setTheme(album.colors);
  albumTitle.textContent = album.title;
  const parts = [album.artist];
  if (album.subtitle) parts.push(album.subtitle);
  albumSubtitle.textContent = parts.join(' \u2022 ');

  buildTrackNav(album);
  loadTrack(trackIndex || 0);
}

async function loadTrack(index) {
  currentTrack = index;
  const album = ALBUMS[currentAlbum];
  const t = album.tracks[index];

  document.querySelectorAll('.track-btn').forEach((btn, i) => {
    btn.className = 'track-btn' + (i === index ? ' active' : '');
  });

  // Use manifest data as default
  trackNumber.textContent = t.number;
  trackTitle.textContent = t.title;
  trackMeta.textContent = '';

  sourceEl.src = t.file;
  audioEl.load();

  // Try to read ID3 tags for richer metadata
  const tags = await readID3(t.file);
  if (tags) {
    if (tags.title) trackTitle.textContent = tags.title;
    const metaParts = [];
    if (tags.artist) metaParts.push(tags.artist);
    if (tags.album) metaParts.push(tags.album);
    if (tags.genre) metaParts.push(tags.genre);
    if (metaParts.length > 0) trackMeta.textContent = metaParts.join(' \u2022 ');
  }

  // Show/hide view toggle
  const viewToggle = document.getElementById('viewToggle');
  if (t.has_sung && t.intended && t.intended.length > 0) {
    viewToggle.style.display = 'flex';
  } else {
    viewToggle.style.display = 'none';
    currentView = 'sung';
  }

  renderCurrentView();
  loadRating();
}

// --- Lyrics sync ---

audioEl.addEventListener('timeupdate', () => {
  const time = audioEl.currentTime;
  const album = ALBUMS[currentAlbum];
  if (!album) return;
  const lines = album.tracks[currentTrack].lines;
  const hasTimestamps = lines.some(l => l.time >= 0);
  if (!hasTimestamps) return;

  let activeIndex = -1;
  for (let i = lines.length - 1; i >= 0; i--) {
    if (!lines[i].section && lines[i].time >= 0 && time >= lines[i].time) {
      activeIndex = i;
      break;
    }
  }

  document.querySelectorAll('.lyric-line:not(.section-tag)').forEach(el => {
    const idx = parseInt(el.id?.replace('line-', ''), 10);
    if (idx === activeIndex) {
      el.className = 'lyric-line active';
    } else if (idx < activeIndex) {
      el.className = 'lyric-line past';
    } else {
      el.className = 'lyric-line';
    }
  });

  if (activeIndex >= 0) {
    const activeLine = document.getElementById('line-' + activeIndex);
    if (activeLine) {
      const lineTop = activeLine.offsetTop - lyricsContainer.offsetTop;
      const scrollTarget = lineTop - lyricsContainer.clientHeight / 3;
      lyricsContainer.scrollTop = scrollTarget;
    }
  }
});

// Auto-advance to next track
audioEl.addEventListener('ended', () => {
  const album = ALBUMS[currentAlbum];
  if (!album) return;
  if (currentTrack < album.tracks.length - 1) {
    loadTrack(currentTrack + 1);
    audioEl.addEventListener('canplay', function onCanPlay() {
      audioEl.removeEventListener('canplay', onCanPlay);
      audioEl.play();
    });
  } else if (currentAlbum < ALBUMS.length - 1) {
    loadAlbum(currentAlbum + 1);
    audioEl.addEventListener('canplay', function onCanPlay() {
      audioEl.removeEventListener('canplay', onCanPlay);
      audioEl.play();
    });
  }
});

// --- View switching ---

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.className = 'view-btn');
  document.getElementById('btn' + view.charAt(0).toUpperCase() + view.slice(1)).className = 'view-btn active';
  renderCurrentView();
}

function renderCurrentView() {
  const album = ALBUMS[currentAlbum];
  if (!album) return;
  const t = album.tracks[currentTrack];

  if (currentView === 'sung') {
    renderLyrics(t.lines, true);
  } else if (currentView === 'intended') {
    renderLyrics(t.intended || [], false);
  } else {
    renderDiff(t);
  }
}

function renderLyrics(lines, withTimestamps) {
  lyricsContainer.innerHTML = '';
  if (!lines || lines.length === 0) {
    lyricsContainer.innerHTML = '<div class="no-lyrics">No lyrics available</div>';
    return;
  }
  const hasTs = withTimestamps && lines.some(l => l.time >= 0);
  lines.forEach((line, i) => {
    const div = document.createElement('div');
    if (line.section) {
      div.className = 'lyric-line section-tag';
      div.textContent = line.text;
    } else {
      div.className = 'lyric-line';
      div.id = 'line-' + i;
      let html = '';
      if (hasTs && line.time >= 0) {
        html += '<span class="timestamp">' + formatTime(line.time) + '</span>';
      }
      html += escHtml(line.text);
      div.innerHTML = html;
      if (hasTs && line.time >= 0) {
        div.onclick = () => { audioEl.currentTime = line.time; audioEl.play(); };
      }
    }
    lyricsContainer.appendChild(div);
  });
  lyricsContainer.scrollTop = 0;
}

function renderDiff(track) {
  lyricsContainer.innerHTML = '';
  const intended = (track.intended || []).filter(l => !l.section).map(l => l.text);
  const sung = (track.lines || []).map(l => l.text);

  if (intended.length === 0 && sung.length === 0) {
    lyricsContainer.innerHTML = '<div class="no-lyrics">No lyrics to compare</div>';
    return;
  }

  const pairs = [];
  const usedSung = new Set();

  for (let i = 0; i < intended.length; i++) {
    let bestMatch = -1;
    let bestScore = 0;
    for (let s = Math.max(0, i - 5); s < Math.min(sung.length, i + 10); s++) {
      if (usedSung.has(s)) continue;
      const score = similarity(intended[i], sung[s]);
      if (score > bestScore && score > 0.3) {
        bestScore = score;
        bestMatch = s;
      }
    }
    if (bestMatch >= 0) {
      for (let s = (pairs.length > 0 ? pairs[pairs.length-1].sIdx + 1 : 0); s < bestMatch; s++) {
        if (!usedSung.has(s)) {
          pairs.push({ type: 'sung', sung: sung[s], sIdx: s });
          usedSung.add(s);
        }
      }
      pairs.push({ type: bestScore > 0.85 ? 'match' : 'changed', intended: intended[i], sung: sung[bestMatch], score: bestScore, sIdx: bestMatch });
      usedSung.add(bestMatch);
    } else {
      pairs.push({ type: 'missing', intended: intended[i] });
    }
  }
  for (let s = 0; s < sung.length; s++) {
    if (!usedSung.has(s)) {
      pairs.push({ type: 'sung', sung: sung[s], sIdx: s });
    }
  }

  let matchCount = 0, totalCount = 0;
  pairs.forEach(p => {
    const div = document.createElement('div');
    div.className = 'diff-line';
    if (p.type === 'match') {
      div.className += ' match';
      div.textContent = '\u2713 ' + p.intended;
      matchCount++; totalCount++;
    } else if (p.type === 'changed') {
      totalCount++;
      const pct = Math.round(p.score * 100);
      div.innerHTML = '<div class="diff-line intended">\u2717 ' + escHtml(p.intended) + '</div>' +
        '<div class="diff-line sung">\u2192 ' + escHtml(p.sung) + ' <span style="opacity:0.5">(' + pct + '%)</span></div>';
      div.className = '';
    } else if (p.type === 'missing') {
      div.className += ' intended';
      div.textContent = '\u2717 ' + p.intended + ' (not sung)';
      totalCount++;
    } else {
      div.className += ' sung';
      div.textContent = '+ ' + p.sung + ' (added)';
    }
    lyricsContainer.appendChild(div);
  });

  if (totalCount > 0) {
    const summary = document.createElement('div');
    summary.style.cssText = 'text-align:center;padding:8px;color:#888;font-size:13px;border-bottom:1px solid #222;margin-bottom:8px;';
    const pct = Math.round(matchCount / totalCount * 100);
    summary.textContent = 'Accuracy: ' + matchCount + '/' + totalCount + ' lines matched (' + pct + '%)';
    lyricsContainer.insertBefore(summary, lyricsContainer.firstChild);
  }
  lyricsContainer.scrollTop = 0;
}

function similarity(a, b) {
  a = a.toLowerCase().replace(/[^a-z\u00e4\u00f6\u00fc\u00df0-9 ]/g, '');
  b = b.toLowerCase().replace(/[^a-z\u00e4\u00f6\u00fc\u00df0-9 ]/g, '');
  if (a === b) return 1;
  const wordsA = a.split(/\s+/);
  const wordsB = b.split(/\s+/);
  let matches = 0;
  wordsA.forEach(w => { if (wordsB.includes(w)) matches++; });
  return matches / Math.max(wordsA.length, wordsB.length);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// --- Ratings ---

const RATING_CATEGORIES = ['overall', 'rhythm', 'text', 'vocals'];
let currentRatings = {};

function initStars() {
  RATING_CATEGORIES.forEach(cat => {
    const container = document.getElementById('stars-' + cat);
    if (!container) return;
    container.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const star = document.createElement('span');
      star.className = 'star';
      star.textContent = '\u2605';
      star.dataset.value = i;
      star.dataset.category = cat;
      star.onclick = () => setStarRating(cat, i);
      container.appendChild(star);
    }
  });
}

function setStarRating(category, value) {
  currentRatings[category] = value;
  updateStarDisplay(category, value);
}

function updateStarDisplay(category, value) {
  const container = document.getElementById('stars-' + category);
  if (!container) return;
  container.querySelectorAll('.star').forEach(star => {
    star.className = 'star' + (parseInt(star.dataset.value) <= value ? ' active' : '');
  });
}

function getRatingKey() {
  const album = ALBUMS[currentAlbum];
  if (!album) return null;
  const track = album.tracks[currentTrack];
  if (!track) return null;
  return 'rating:' + track.file;
}

function loadRating() {
  currentRatings = {};
  const key = getRatingKey();
  if (!key) return;
  try {
    const saved = JSON.parse(localStorage.getItem(key) || '{}');
    currentRatings = saved;
    RATING_CATEGORIES.forEach(cat => {
      updateStarDisplay(cat, saved[cat] || 0);
    });
    document.getElementById('ratingComment').value = saved.comment || '';
  } catch(e) {
    RATING_CATEGORIES.forEach(cat => updateStarDisplay(cat, 0));
    document.getElementById('ratingComment').value = '';
  }
}

function saveRating() {
  const key = getRatingKey();
  if (!key) return;
  currentRatings.comment = document.getElementById('ratingComment').value;
  localStorage.setItem(key, JSON.stringify(currentRatings));
  const status = document.getElementById('ratingStatus');
  status.className = 'rating-status show';
  setTimeout(() => { status.className = 'rating-status'; }, 1500);
}

function exportRatings() {
  const allRatings = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('rating:')) {
      try {
        allRatings[key.replace('rating:', '')] = JSON.parse(localStorage.getItem(key));
      } catch(e) {}
    }
  }

  // Build markdown table
  let md = '| Track | Overall | Rhythm | Text | Vocals | Comment |\n';
  md += '|-------|---------|--------|------|--------|---------|\n';
  Object.entries(allRatings).forEach(([file, r]) => {
    const name = file.split('/').pop().replace('.mp3', '');
    md += '| ' + name + ' | ' + (r.overall||'-') + ' | ' + (r.rhythm||'-') + ' | ' + (r.text||'-') + ' | ' + (r.vocals||'-') + ' | ' + (r.comment||'').replace(/\n/g,' ') + ' |\n';
  });

  // Download as file
  const blob = new Blob([md], {type: 'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ratings_export.md';
  a.click();
  URL.revokeObjectURL(url);
}

initStars();

// --- Start ---
init();
</script>
